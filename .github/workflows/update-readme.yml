name: Update README

on:
  push:
    branches: [main]
    paths:
      - "day*.c"
      - "make_assets.py"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild banner, grid and README
        run: python make_assets.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git diff --cached --quiet || git commit -m "chore: update progress (auto)"
          git push
